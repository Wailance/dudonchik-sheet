<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Дудончик | Чарник PF2e</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#171717;background:#fff;letter-spacing:0;--bg:#fff;--panel:#f4f4f4;--line:#d1d1d1;--muted:#555;--ink:#171717;--soft:#f4f4f4}
*{box-sizing:border-box}body{margin:0;min-width:300px}button,input,select,textarea{font:inherit;border-radius:0}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}a{color:var(--ink);text-underline-offset:3px}:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.shell{max-width:1380px;margin:auto;padding:0 22px 70px}.header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:19px 0;border-bottom:1px solid var(--line)}
.identity{display:flex;align-items:center;gap:13px;min-width:0}.avatar{width:64px;height:64px;flex:none;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-size:27px;overflow:hidden;cursor:pointer}.avatar img{width:100%;height:100%;object-fit:cover}
.portrait-full{display:block;width:100%;max-width:560px;height:auto;border:1px solid var(--line)}
.inventory-rule summary{justify-content:space-between}.inventory-rule summary strong{min-width:0;flex:1}.inventory-rule summary .tag{margin-left:8px}.inventory-rule .rule-body{padding-bottom:12px}.inventory-rule .row-actions{margin-top:10px}
.identity h1{font-size:21px;line-height:1.18;margin:0;font-weight:700;overflow-wrap:anywhere}.identity p{font-size:12px;color:var(--muted);margin:4px 0 0}.header-actions,.row-actions,.inline-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.btn{border:1px solid #999;background:#fff;color:var(--ink);min-height:36px;padding:7px 12px;white-space:nowrap}.btn:hover{border-color:var(--ink);background:var(--soft)}.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.btn.primary:hover{background:#333}.btn.danger{border-color:var(--ink);text-decoration:underline}.btn.small{min-height:30px;padding:4px 8px;font-size:13px}.btn.square{width:34px;min-height:34px;padding:0;display:grid;place-items:center;font-size:20px;line-height:1}.btn:active{transform:translateY(1px)}
.tabs{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--line);padding-top:12px;scrollbar-width:thin}.tab{border:0;background:none;color:var(--muted);font-weight:600;padding:12px 15px;white-space:nowrap;border-bottom:2px solid transparent}.tab.active{color:var(--ink);border-color:var(--ink)}.tab:hover{color:var(--ink);background:var(--soft)}
.content{padding-top:20px}.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}.section-title h2{font-size:19px;margin:0}.eyebrow{font-size:11px;color:var(--ink);text-transform:uppercase;font-weight:800;letter-spacing:1px}.muted{color:var(--muted)}.smalltext{font-size:12px}.stack{display:grid;gap:17px}.cols{display:grid;grid-template-columns:minmax(0,1.13fr) minmax(290px,.87fr);gap:22px}.block{padding:17px 0;border-bottom:1px solid var(--line)}.block:first-child{padding-top:0}.block:last-child{border-bottom:0}.block h3{font-size:14px;margin:0 0 12px;font-weight:700}
.statbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:20px}.stat{background:var(--panel);border:1px solid var(--line);padding:10px 9px;text-align:center;min-width:0}.stat .number{display:block;font-size:24px;font-weight:800;line-height:1.3}.stat label{font-size:11px;color:var(--muted);text-transform:uppercase}.stat.accent{border-color:var(--ink)}.stat.accent .number{color:var(--ink)}.stat.warn .number{color:var(--ink)}
.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.metric{background:var(--panel);border:1px solid var(--line);padding:13px}.metric strong{display:block;font-size:25px}.metric span{font-size:12px;color:var(--muted)}.metric .tiny{font-size:11px;color:var(--muted);display:block;margin-top:5px}
.resource{background:var(--panel);border:1px solid var(--line);padding:14px;margin-bottom:9px}.resource-head{display:flex;align-items:center;justify-content:space-between;gap:9px}.resource-head strong{font-size:14px}.value{color:var(--ink);font-weight:750;font-size:18px;white-space:nowrap}.controls{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}.controls input[type=number]{width:65px}.track{height:7px;background:#d8d8d8;overflow:hidden;margin-top:11px}.track span{display:block;height:100%;background:var(--ink);transition:width .2s}.track.hp span{background:var(--ink)}
.slot-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.slot-row:last-child{border:0}.pips{display:flex;gap:7px}.pip{width:29px;height:29px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:0}.pip.used{background:#fff;border-color:#888;color:var(--muted)}.pip:hover{border-color:#444}
.entry{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}.entry:last-child{border-bottom:0}.entry-main{min-width:0}.entry-title{font-weight:650;font-size:14px;overflow-wrap:anywhere}.entry-sub{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.45;overflow-wrap:anywhere}.tag{display:inline-block;color:var(--muted);font-size:11px;font-weight:700;margin-left:6px}.count{font-variant-numeric:tabular-nums;min-width:25px;text-align:center}
.rule{border-bottom:1px solid var(--line);padding:10px 0}.rule summary{cursor:pointer;display:flex;align-items:center;gap:8px;list-style:none;min-height:34px}.rule summary::-webkit-details-marker{display:none}.rule summary::before{content:"+";color:var(--ink);font-size:20px;width:18px;flex:none}.rule[open] summary::before{content:"−"}.rule summary strong{font-size:14px;overflow-wrap:anywhere}.rule .tag{margin-left:auto;white-space:nowrap}.rule-body{padding:6px 0 8px 26px;color:var(--ink);font-size:13px;line-height:1.65;white-space:pre-line;overflow-wrap:anywhere}.rule-body p{margin:5px 0}.rule-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:9px}.rule-actions a{font-size:12px}.section-intro{color:var(--muted);font-size:13px;line-height:1.55;margin:0 0 18px}.section-title .btn{flex:none}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar h2{margin:0;font-size:19px}.search{width:min(100%,280px);background:#fff;border:1px solid #999;color:var(--ink);padding:9px 10px}.field{display:grid;gap:5px;font-size:12px;color:var(--muted)}.field input,.field select,.field textarea,.controls input{background:#fff;border:1px solid #999;color:var(--ink);padding:8px;min-width:0}.field textarea{min-height:95px;resize:vertical}.edit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.section-spacer{margin-top:25px}
.notice{font-size:12px;color:var(--muted);line-height:1.5;padding:10px 12px;border-left:2px solid var(--ink);background:var(--panel)}.notes{width:100%;min-height:220px;resize:vertical;background:#fff;color:var(--ink);border:1px solid var(--line);padding:13px;line-height:1.5}
dialog{border:1px solid #888;background:#fff;color:var(--ink);width:min(95vw,490px);max-height:88vh;padding:20px;box-shadow:0 20px 70px #0005}dialog::backdrop{background:#0009}dialog h2{font-size:18px;margin:0 0 16px}dialog form{display:grid;gap:12px}dialog menu{display:flex;justify-content:flex-end;gap:8px;padding:8px 0 0;margin:0}dialog .field textarea{min-height:80px}
#toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;border:1px solid var(--ink);padding:10px 14px;z-index:10;max-width:min(360px,90vw);display:none}
@media(max-width:840px){.cols{grid-template-columns:1fr}.header{align-items:flex-start}.header-actions{justify-content:flex-end}}
@media(max-width:600px){.shell{padding:0 14px 65px}.header{flex-wrap:wrap;padding:13px 0}.header-actions{width:100%;justify-content:flex-start}.identity h1{font-size:18px}.tabs{margin:0 -14px;padding-left:9px;position:sticky;top:0;z-index:5;background:var(--bg)}.tab{padding:11px 12px;font-size:13px}.content{padding-top:14px}.statbar{grid-template-columns:repeat(3,1fr)}.metric-grid{grid-template-columns:repeat(2,1fr)}.metric strong{font-size:21px}.edit-grid{grid-template-columns:repeat(2,1fr)}.entry{gap:5px}.entry .row-actions{justify-content:flex-end}.btn.small{font-size:12px}}
@media(max-width:360px){.metric-grid{grid-template-columns:repeat(2,1fr)}.stat .number{font-size:20px}.entry .row-actions{max-width:120px}}
</style>
</head>
<body>
<div class="shell">
  <header class="header">
    <div class="identity">
      <label class="avatar" title="Нажмите, чтобы добавить портрет"><span id="avatar">Д</span><input id="portrait-input" type="file" accept="image/*" hidden></label>
      <div><h1 id="hero-name">Дудончик</h1><p id="hero-line">Бард 10 · Человек · Маэстро</p></div>
    </div>
    <div class="header-actions">
      <button class="btn" id="export-btn" title="Скачать копию персонажа для переноса на другое устройство">Экспорт JSON</button>
      <button class="btn" id="import-btn" title="Загрузить сохранённого персонажа">Импорт JSON</button>
      <input id="import-input" type="file" accept=".json,application/json" hidden>
    </div>
  </header>
  <nav class="tabs" aria-label="Разделы чарника">
    <button class="tab active" data-tab="battle">Бой</button>
    <button class="tab" data-tab="compositions">Композиции</button>
    <button class="tab" data-tab="spells">Заклинания</button>
    <button class="tab" data-tab="abilities">Способности</button>
    <button class="tab" data-tab="inventory">Инвентарь</button>
    <button class="tab" data-tab="character">Персонаж</button>
    <button class="tab" data-tab="notes">Заметки</button>
  </nav>
  <main id="content" class="content"></main>
</div>
<dialog id="editor"><h2 id="editor-title"></h2><form id="editor-form"><div id="editor-fields"></div><menu><button type="button" class="btn" id="editor-cancel">Отмена</button><button type="submit" class="btn primary">Сохранить</button></menu></form></dialog>

const slotsAtLevel=level=>{
 const ranks=[null];
 for(let r=1;r<=Math.min(9,Math.floor((level+1)/2));r++){

 }
 if(level>=19)ranks.push({max:1,used:0});
 return ranks;
};

const toast=t=>{const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.style.display="none",3400)};
const modify=fn=>{fn();persist();render()};
const button=(action,text,extra="")=>`<button class="btn small ${extra}" data-action="${action}">${text}</button>`;
const editButton=(collection,id)=>`<button class="btn small" data-edit="${collection}" data-id="${esc(id)}" title="Редактировать">Изменить</button>`;
function calc(){
 const l=Number(state.level)||10;
 return {ac:10+l+Number(state.armorProficiency||0)+ability("dex")+Number(state.armorBonus||0)+Number(state.armorPotency||0),
  dc:10+l+Number(state.spellProficiency||0)+ability("cha"),
  spell:l+Number(state.spellProficiency||0)+ability("cha"),
  perception:l+(l>=11?6:4)+ability("wis"),
  fort:l+(l>=9?4:2)+ability("con")+Number(state.resilient||0),
  reflex:l+(l>=3?4:2)+ability("dex")+Number(state.resilient||0),
  will:l+(l>=17?8:l>=9?6:4)+ability("wis")+Number(state.resilient||0),
  speed:25+Number(state.speedBonus||0),
  performance:l+6+ability("cha")+Number(state.performanceItem||0)+2
 };
}
function statbar(){
 const c=calc();
 return `<div class="statbar">
 <div class="stat accent"><span class="number">${c.ac}</span><label>КБ</label></div>
 <div class="stat"><span class="number">${c.dc}</span><label>КС магии</label></div>
 <div class="stat"><span class="number">${signed(c.spell)}</span><label>Атака магией</label></div>
 <div class="stat"><span class="number">${c.speed}</span><label>Скорость · футы</label></div>
 <div class="stat"><span class="number">${signed(c.perception)}</span><label>Восприятие</label></div>
 <div class="stat warn"><span class="number">${state.hp}/${state.maxHP}</span><label>Здоровье</label></div></div>`;
}
function resource(label,current,max,key,step=1,kind=""){
 return `<div class="resource"><div class="resource-head"><strong>${label}</strong><span class="value">${current} / ${max}</span></div>
 <div class="track ${kind}"><span style="width:${max>0?cap(current/max*100,0,100):0}%"></span></div>
 <div class="controls"><button class="btn square" data-counter="${key}" data-delta="-${step}" aria-label="Уменьшить ${label}">−</button>
 <button class="btn square" data-counter="${key}" data-delta="${step}" aria-label="Увеличить ${label}">+</button>
 ${key==="hp"?'<input id="hp-amount" type="number" min="1" value="5" aria-label="Количество HP"><button class="btn small" data-action="damage">Урон</button><button class="btn small" data-action="heal">Лечение</button>':""}</div></div>`;
}
function slots(){
 return state.slots.slice(1).map((s,i)=>`<div class="slot-row"><span>${i+1} ранг <span class="muted smalltext">· ${s.max-s.used}/${s.max}</span></span><div class="pips">${Array.from({length:s.max},(_,j)=>`<button class="pip ${j<s.used?"used":""}" data-slot="${i+1}" data-index="${j}" title="${j<s.used?"Вернуть ячейку":"Потратить ячейку"}" aria-label="${j<s.used?"Вернуть":"Потратить"} ячейку ${i+1} ранга"></button>`).join("")}</div></div>`).join("");
}

 ${resource("HP",state.hp,state.maxHP,"hp",1,"hp")}
 ${resource("Фокус",state.focus,state.focusMax,"focus")}

 ${resource("Очки героя",state.heroPoints,3,"heroPoints")}

 <div class="metric"><strong>${signed(state.level+6+ability("wis")+2)}</strong><span>Медицина</span></div>
 <div class="metric"><strong>${signed(c.perception+2)}</strong><span>Инициатива</span><small class="tiny">Через восприятие</small></div></div></section>
 <section class="block"><div class="section-title"><h2>Эффекты</h2>${button("add-condition","+ Добавить")}</div>

function ruleEntry(entry,collection,index){
 const reference=(collection==="spells"?spellRules:collection==="compositions"?compositionRules:featRules)[entry.name];
 const meta=collection==="spells"?(entry.signature?"Signature · ":"")+(entry.rank===0?"Кантрип":entry.rank+" ранг"):collection==="compositions"?entry.kind:entry.level+" ур. · "+entry.type;
 const details=Array.isArray(reference)?`<p><strong>${esc(reference[0])}</strong></p><p>${esc(reference[1])}</p>`:reference?`<p>${esc(reference)}</p>`:"";
 const link=ruleLink(collection==="feats"?"Feats":"Spells",entry.name.replace(/^.*→ /,"").replace(/ \(.+\)$/,""));
 const id=collection==="spells"?entry.id:String(index);
 return `<details class="rule" data-entry-key="${esc(collection+":"+id)}"><summary><strong>${esc(entry.name)}</strong><span class="tag">${esc(meta)}</span></summary><div class="rule-body">${details}${entry.note?`<p><strong>Моя заметка:</strong> ${esc(entry.note)}</p>`:""}<div class="rule-actions">${editButton(collection,id)}<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">Полные правила ↗</a></div></div></details>`;
}
function spellList(arr){return arr.map(s=>ruleEntry(s,"spells",0)).join("")}
function spellsView(){
 return `<div class="toolbar"><h2>Заклинания</h2>${button("add-spell","+ Добавить заклинание","primary")}</div>
 <p class="section-intro">Нажми на название для эффекта, условий применения и своей заметки. Обычные ячейки отмечаются в разделе «Бой».</p>
 <div class="cols"><div>${[0,1,2].map(r=>`<section class="block"><div class="section-title"><h2>${r===0?"Кантрипы":r+" ранг"}</h2>${r>0&&state.slots[r]?`<span class="muted smalltext">${state.slots[r].max-state.slots[r].used}/${state.slots[r].max} ячеек</span>`:""}</div>${spellList(state.spells.filter(s=>s.rank===r))||'<p class="muted">Нет заклинаний.</p>'}</section>`).join("")}</div>
 <div>${[3,4,5,6,7,8,9,10].filter(r=>r<=5||state.spells.some(s=>s.rank===r)).map(r=>`<section class="block"><div class="section-title"><h2>${r} ранг</h2>${state.slots[r]?`<span class="muted smalltext">${state.slots[r].max-state.slots[r].used}/${state.slots[r].max} ячеек</span>`:""}</div>${spellList(state.spells.filter(s=>s.rank===r))||'<p class="muted">Нет заклинаний.</p>'}</section>`).join("")}</div></div>`;
}
function compositionsView(){
 return `<div class="toolbar"><h2>Композиции</h2>${button("add-composition","+ Добавить","primary")}</div><p class="section-intro">Кантрипы не требуют ячеек. Фокусные заклинания используют очки фокуса, но при провале проверки Lingering/Fortissimo очко не тратится. Refocus возвращает 1 очко за 10 минут.</p>
 <div class="cols"><section><div class="section-title"><h2>Кантрипы-композиции</h2></div>${state.compositions.map((s,i)=>({s,i})).filter(x=>x.s.kind==="Кантрип").map(x=>ruleEntry(x.s,"compositions",x.i)).join("")}</section>
 <section><div class="section-title"><h2>Фокусные композиции</h2></div>${state.compositions.map((s,i)=>({s,i})).filter(x=>x.s.kind!=="Кантрип" && x.s.name!=="Counter Performance").map(x=>ruleEntry(x.s,"compositions",x.i)).join("")}<p class="notice">Counter Performance смотри в «Способностях». Рефокус после боя восстанавливает фокус по правилам.</p></section></div>`;
}
const featTiming={
 "Battle Medicine":"Действие","Bon Mot":"Действие",
 "Lingering Composition":"Свободное действие","Fortissimo Composition":"Свободное действие",
 "Quickened Casting":"Свободное действие"
};
function abilitiesView(){
 const feats=state.feats.map((feat,index)=>({feat,index,timing:feat.timing||featTiming[feat.name]||"Пассивно"}));
 const byTiming=timing=>feats.filter(x=>x.timing===timing).sort((a,b)=>a.feat.level-b.feat.level).map(x=>ruleEntry(x.feat,"feats",x.index)).join("");
 const counter=state.compositions.map((entry,index)=>({entry,index})).find(x=>x.entry.name==="Counter Performance");
 const siphon=state.spells.find(x=>x.name==="Shadow Siphon");
 const mask=state.inventory.find(x=>x.id==="i2" && x.qty>0);
 const maskRule=mask?`<details class="rule" data-entry-key="ability:mask"><summary><strong>${esc(mask.name)}</strong><span class="tag">Реакция · 1/день</span></summary><div class="rule-body"><p>${esc(mask.note)}</p><button class="btn small" data-open-inventory="i2">Открыть в инвентаре</button></div></details>`:"";
 const reactions=(counter?ruleEntry(counter.entry,"compositions",counter.index):"")+
  (siphon?ruleEntry(siphon,"spells",0):"")+maskRule+byTiming("Реакция");
 return `<div class="toolbar"><h2>Способности</h2>${button("add-feat","+ Фит","primary")}</div>
 <div class="cols"><div>
 <section class="block"><div class="section-title"><h2>Реакции</h2></div>${reactions||'<p class="muted smalltext">Нет реакций.</p>'}</section>
 <section class="block"><div class="section-title"><h2>Действия</h2></div>${byTiming("Действие")||'<p class="muted smalltext">Нет способностей.</p>'}</section>
 <section class="block"><div class="section-title"><h2>Свободные действия</h2></div>${byTiming("Свободное действие")||'<p class="muted smalltext">Нет способностей.</p>'}</section>
 </div><section class="block"><div class="section-title"><h2>Пассивные фиты</h2></div>${byTiming("Пассивно")||'<p class="muted smalltext">Нет способностей.</p>'}</section></div>`;
}
function inventoryView(){
 const categories=["Снаряжение","Палочки","Свитки","Расходники"];
 const selected=state.inventory.filter(x=>[x.name,x.note,x.category].join(" ").toLowerCase().includes(filter.toLowerCase()));
 return `<div class="toolbar"><h2>Инвентарь</h2><div class="inline-actions">${button("add-item","+ Предмет","primary")}${button("reset-inventory","Восстановить закупку")}<input id="item-search" class="search" type="search" placeholder="Поиск предметов" aria-label="Поиск предметов" value="${esc(filter)}"></div></div>
 <p class="notice">Стартовый набор: 9 987 зм из 15 000 зм; при старте остаётся 5 013 зм. Текущий кошелёк ниже. Нажми на предмет для описания. «−» расходует свиток или брошь; «Исп.» отмечает дневное применение палочки, не удаляя её. Восстановление закупки заменяет текущий инвентарь и деньги после подтверждения.</p>
 ${categories.map(cat=>{const arr=selected.filter(x=>x.category===cat);return `<section class="block"><div class="section-title"><h2>${cat}</h2><span class="muted smalltext">${arr.reduce((n,x)=>n+x.qty,0)} шт.</span></div>${arr.map(x=>`<details class="rule inventory-rule" data-entry-key="${esc("inventory:"+x.id)}"><summary><strong>${esc(x.name)}</strong><span class="tag">${x.level} ур.</span><span class="tag">${x.qty} шт.</span></summary><div class="rule-body"><p>${esc(x.note||"Описание не добавлено.")}</p>${x.price!=null?`<p class="muted">Цена за штуку: ${x.price} зм</p>`:""}${x.daily?`<p>Использовано сегодня: ${x.used||0}/${x.qty}</p>`:""}<div class="row-actions"><button class="btn square" data-item="${esc(x.id)}" data-delta="-1" title="Израсходовать или убрать одну штуку" aria-label="Уменьшить количество ${esc(x.name)}">−</button><span class="count">${x.qty}</span><button class="btn square" data-item="${esc(x.id)}" data-delta="1" title="Добавить одну штуку" aria-label="Увеличить количество ${esc(x.name)}">+</button>${x.daily?`<button class="btn small" data-use="${esc(x.id)}" ${x.used>=x.qty?"disabled":""} title="Отметить применение на сегодня">Исп.</button>`:""}${editButton("inventory",x.id)}</div></div></details>`).join("")||'<p class="muted smalltext">Здесь ничего нет.</p>'}</section>`}).join("")}
 <section class="block"><h2>Деньги</h2><div class="edit-grid">${["gp","sp","cp"].map(k=>`<label class="field">${({gp:"Золотые",sp:"Серебряные",cp:"Медные"})[k]}<input type="number" min="0" data-money="${k}" value="${Number(state.money[k])||0}"></label>`).join("")}</div></section>`;
}

 inventory:(v={})=>[{key:"name",label:"Название",value:v.name||""},{key:"category",label:"Раздел",type:"select",value:v.category||"Снаряжение",options:["Снаряжение","Палочки","Свитки","Расходники"].map(x=>[x,x])},{key:"level",label:"Уровень предмета",type:"number",value:v.level||0},{key:"qty",label:"Количество",type:"number",value:v.qty??1},{key:"price",label:"Цена за штуку (зм)",type:"number",value:v.price??0},{key:"daily",label:"Отмечать использования за день",type:"select",value:v.daily?"yes":"no",options:[["no","Нет"],["yes","Да"]]},{key:"note",label:"Описание / заметка",type:"textarea",value:v.note||""}],
 feats:(v={})=>[{key:"name",label:"Название",value:v.name||""},{key:"level",label:"Уровень",type:"number",value:v.level||1},{key:"type",label:"Категория",value:v.type||"Бард"},{key:"timing",label:"Применение",type:"select",value:v.timing||featTiming[v.name]||"Пассивно",options:["Реакция","Действие","Свободное действие","Пассивно"].map(x=>[x,x])},{key:"note",label:"Описание",type:"textarea",value:v.note||""}],
 skills:(v={})=>[{key:"name",label:"Название",value:v.name||""},{key:"ability",label:"Характеристика",type:"select",value:v.ability||"cha",options:Object.entries(attrLabels)},{key:"rank",label:"Проф. (0 / 2 / 4 / 6 / 8)",type:"select",value:v.rank??2,options:[[0,"Нет"],[2,"Тренирован"],[4,"Эксперт"],[6,"Мастер"],[8,"Легенда"]]},{key:"item",label:"Бонус предмета",type:"number",value:v.item||0}]
};
function openEditor(collection,id){
 const index=collection==="inventory"||collection==="spells"?state[collection].findIndex(x=>x.id===id):Number(id);
 const entry=id==null?null:state[collection][index];
 editor={collection,index:id==null?-1:index};
 $("#editor-title").textContent=entry?"Изменить запись":"Новая запись";
 addFields(fieldSets[collection](entry||{}));
 if(entry){const b=document.createElement("button");b.type="button";b.className="btn danger";b.id="delete-entry";b.textContent="Удалить запись";$("#editor-form menu").prepend(b)}
 $("#editor").showModal();$("#editor-fields input, #editor-fields select")?.focus();
}
function closeEditor(){ $("#editor").close();const b=$("#delete-entry");if(b)b.remove();editor=null}
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.dataset.tab){tab=t.dataset.tab;render();return}
 if(t.dataset.openInventory){tab="inventory";render();const item=[...$("#content").querySelectorAll(".inventory-rule")].find(x=>x.dataset.entryKey==="inventory:"+t.dataset.openInventory);if(item){item.open=true;item.scrollIntoView({block:"start"})}return}
 if(t.dataset.slot){modify(()=>{const s=state.slots[Number(t.dataset.slot)];const i=Number(t.dataset.index);s.used=(i<s.used)?i:i+1});return}
 if(t.dataset.counter){modify(()=>{const k=t.dataset.counter;state[k]=cap(Number(state[k])+Number(t.dataset.delta),0,k==="hp"?state.maxHP:k==="focus"?state.focusMax:k==="staffCharges"?state.staffMax:k==="heroPoints"?3:999)});return}
 if(t.dataset.item){modify(()=>{const x=state.inventory.find(y=>y.id===t.dataset.item);x.qty=Math.max(0,x.qty+Number(t.dataset.delta));if(x.daily)x.used=Math.min(x.qty,x.used||0)});return}
 if(t.dataset.use){modify(()=>{const x=state.inventory.find(y=>y.id===t.dataset.use);x.used=cap((x.used||0)+1,0,x.qty)});return}
 if(t.dataset.condition!=null){modify(()=>state.conditions.splice(Number(t.dataset.condition),1));return}
 if(t.dataset.edit){openEditor(t.dataset.edit,t.dataset.id);return}
 if(t.id==="delete-entry"){if(confirm("Удалить эту запись?")){modify(()=>state[editor.collection].splice(editor.index,1));closeEditor()}return}
 if(t.id==="editor-cancel"){closeEditor();return}
 switch(t.dataset.action){
  case "change-portrait":$("#portrait-input").click();break;
  case "damage":{const n=cap($("#hp-amount").value,0,9999);modify(()=>{const soak=Math.min(state.tempHP,n);state.tempHP-=soak;state.hp=cap(state.hp-(n-soak),0,state.maxHP)});break}
  case "heal":{const n=cap($("#hp-amount").value,0,9999);modify(()=>state.hp=cap(state.hp+n,0,state.maxHP));break}
  case "refocus":modify(()=>state.focus=Math.min(state.focus+1,state.focusMax));toast("10 минут Refocus: +1 очко фокуса");break;
  case "quickened":modify(()=>state.quickenedUsed=!state.quickenedUsed);break;
  case "rest":if(confirm("Провести ежедневную подготовку после отдыха? Восстановятся ячейки, фокус, заряды подготовленного посоха и ежедневные предметы. Свитки и броши не восстановятся.")){modify(()=>{state.slots.slice(1).forEach(x=>x.used=0);state.focus=state.focusMax;state.staffCharges=state.staffMax;state.quickenedUsed=false;state.inventory.forEach(x=>{if(x.daily)x.used=0})});toast("Ежедневная подготовка завершена")}break;
  case "add-condition":{const x=prompt("Название эффекта (например, frightened 1)");if(x?.trim())modify(()=>state.conditions.push(x.trim()));break}
  case "add-item":openEditor("inventory");break;
  case "reset-inventory":if(confirm("Заменить весь инвентарь стартовым набором и установить кошелёк на 5 013 зм? Другие данные персонажа сохранятся.")){modify(()=>{state.inventory=deepCopy(seed.inventory);state.money=deepCopy(seed.money)});toast("Закупка восстановлена")}break;
  case "add-spell":openEditor("spells");break;
  case "add-composition":openEditor("compositions");break;
  case "add-feat":openEditor("feats");break;
  case "add-skill":openEditor("skills");break;
 }
});
$("#editor-form").addEventListener("submit",e=>{
 e.preventDefault();if(!editor)return;
 const values=Object.fromEntries(new FormData(e.currentTarget));
 if(!values.name?.trim()){toast("Укажи название");return}
 const {collection,index}=editor;
 if(collection==="inventory"){values.level=cap(values.level,0,99);values.qty=cap(values.qty,0,999);values.price=cap(values.price,0,999999);values.daily=values.daily==="yes";values.used=state.inventory[index]?.used||0;values.used=Math.min(values.used,values.qty)}
 if(collection==="spells"){values.rank=cap(values.rank,0,10);values.signature=values.signature==="yes"}
 if(collection==="feats")values.level=cap(values.level,1,20);
 if(collection==="skills"){values.rank=Number(values.rank);values.item=cap(values.item,0,20)}
 if(index<0 && ["inventory","spells"].includes(collection))values.id=String(Date.now())+Math.random().toString(36).slice(2,6);
 modify(()=>{if(index<0)state[collection].push(values);else state[collection][index]={...state[collection][index],...values}});
 closeEditor();
});
$("#export-btn").onclick=()=>{
 const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="dudonchik-character.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast("Файл персонажа скачан");
};
$("#import-btn").onclick=()=>$("#import-input").click();
$("#import-input").onchange=async e=>{
 const file=e.target.files?.[0];if(!file)return;
 try{
  const data=JSON.parse(await file.text());
  if(!data||!Array.isArray(data.spells)||!Array.isArray(data.inventory)||!Array.isArray(data.slots)||!data.abilities||!Array.isArray(data.skills))throw Error("Это не сохранение этого чарника");
  if(!confirm("Заменить текущий персонаж содержимым файла? Перед этим можно скачать текущую копию."))return;
  state=upgradeSave(data);persist();render();toast("Персонаж загружен");
 }catch(err){toast("Не удалось загрузить: "+err.message)}finally{e.target.value=""}
};
$("#portrait-input").onchange=e=>{
 const file=e.target.files?.[0];if(!file)return;
 const img=new Image();img.onload=()=>{
  const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d");canvas.width=200;canvas.height=200;
  const side=Math.min(img.width,img.height);ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,200,200);
  modify(()=>state.portrait=canvas.toDataURL("image/jpeg",.76));URL.revokeObjectURL(img.src)
 };img.src=URL.createObjectURL(file);
};
$("#content").addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset.profile){modify(()=>{
  if(t.dataset.profile==="level"){
   const oldLevel=Number(state.level),nextLevel=cap(t.value,1,20);
   if(nextLevel!==oldLevel){
    const nextSlots=slotsAtLevel(nextLevel);
    nextSlots.slice(1).forEach((s,i)=>{s.used=Math.min(s.max,state.slots[i+1]?.used||0)});
    state.slots=nextSlots;
    const spellRank=level=>level>=19?8:level>=15?6:level>=7?4:2;
    const armorRank=level=>level>=13?4:2;
    if(state.spellProficiency===spellRank(oldLevel))state.spellProficiency=spellRank(nextLevel);
    if(state.armorProficiency===armorRank(oldLevel))state.armorProficiency=armorRank(nextLevel);
    if(state.staffMax===Math.ceil(oldLevel/2)){
     state.staffMax=Math.ceil(nextLevel/2);
     state.staffCharges=Math.min(state.staffCharges,state.staffMax);
    }
   }
   state.level=nextLevel;
  }else state[t.dataset.profile]=t.value;
 });return}
 if(t.dataset.ability){modify(()=>state.abilities[t.dataset.ability]=cap(t.value,1,30));return}
 if(t.dataset.setting){modify(()=>{state[t.dataset.setting]=cap(t.value,0,999);if(t.dataset.setting==="maxHP")state.hp=Math.min(state.hp,state.maxHP);if(t.dataset.setting==="focusMax")state.focus=Math.min(state.focus,state.focusMax);if(t.dataset.setting==="staffMax")state.staffCharges=Math.min(state.staffCharges,state.staffMax)});return}
 if(t.dataset.money){modify(()=>state.money[t.dataset.money]=cap(t.value,0,999999));return}
});
$("#content").addEventListener("input",e=>{
 if(e.target.id==="notes-text"){state.notes=e.target.value;persist()}
 if(e.target.id==="item-search"){const pos=e.target.selectionStart;filter=e.target.value;render();const next=$("#item-search");next.focus();next.setSelectionRange(pos,pos)}
});
render();
</script>
